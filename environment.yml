name: tactivision
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  # Shared libraries used by the Linux opencv-python wheel.
  - libgl
  - glib
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0+cu128
      - torchvision==0.22.0+cu128
      - numpy==2.4.6
      - opencv-python==4.11.0.86
      - ultralytics==8.4.198
      - pytest==9.1.1
      - "-e .[detect,test]"
